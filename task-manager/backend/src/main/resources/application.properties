spring.application.name=backend
spring:
  datasource:
    url: ${DB_URL}              # jdbc:postgresql://<host>/<db>?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000   # generous: Neon may be waking from suspend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}         # at least 32 bytes
    access-ttl: 15m
  refresh:
    ttl: 7d
    cookie-secure: ${COOKIE_SECURE:false}   # true in production (HTTPS)
    cookie-same-site: ${COOKIE_SAMESITE:Strict}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}